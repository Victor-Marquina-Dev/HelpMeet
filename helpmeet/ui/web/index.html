  <!-- Rail rojo persistente durante grabacion/captura de pantalla -->
  <div class="rec-rail" id="recRail" aria-hidden="true"></div>

  <!-- ============ TITLEBAR ============
       Reconstruida desde el mockup: minima, sin marca ni chip de version. A la
       izquierda el plegado del panel; a la derecha buscar, tema y los controles
       de ventana. #topbarStatus se conserva aunque el mockup no lo tenga: es
       funcional (muestra el estado de la grabacion en curso). -->
  <div class="titlebar">
    <button class="icon-btn sidebar-collapse-btn no-drag" id="btnMenu" type="button"
            data-i18n-attr="title:topbar.menu,aria-label:topbar.menu"
            title="Mostrar u ocultar el panel" aria-label="Colapsar barra lateral">
      <svg class="icon"><use href="#i-panel"/></svg>
    </button>

    <div class="topbar-status" id="topbarStatus" aria-live="polite"></div>

    <div class="titlebar-right no-drag">
      <button class="icon-btn titlebar-action" id="btnSearchTop" type="button" aria-label="Buscar" title="Buscar (Ctrl+K)">
        <svg class="icon"><use href="#i-search"/></svg>
      </button>
      <button class="icon-btn titlebar-action" id="btnThemeToggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">
        <svg class="icon" id="themeIcon"><use href="#i-sun"/></svg>
      </button>
      <div class="wincontrols" id="winControls">
        <button class="icon-btn" id="wcMin" type="button" data-i18n-attr="title:topbar.minimize,aria-label:topbar.minimize" title="Minimizar" aria-label="Minimizar"><svg class="icon"><use href="#i-minus"/></svg></button>
        <button class="icon-btn" id="wcMax" type="button" data-i18n-attr="title:topbar.maximize,aria-label:topbar.maximize" title="Maximizar" aria-label="Maximizar"><svg class="icon"><use href="#i-maximize"/></svg></button>
        <button class="icon-btn close" id="wcClose" type="button" data-i18n-attr="title:topbar.close,aria-label:topbar.close" title="Cerrar" aria-label="Cerrar"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
    </div>
  </div>

  <!-- ============ SHELL ============
       Un solo elemento para el panel lateral: al colapsar cambia de ancho
       (.shell.collapsed) en vez de alternar entre dos <aside> distintos, que es
       lo que hacia el diseno anterior con .sidebar + .sidebar-rail. -->
  <div class="shell no-drag" id="shell">

    <aside class="sidebar" id="sidebar" aria-label="Proyectos y navegacion">
      <nav class="nav" aria-label="Accesos directos">
        <button class="navitem" id="navHome" data-nav="inicio" type="button" data-i18n-attr="title:sidebar.home" title="Inicio">
          <svg class="icon"><use href="#i-home"/></svg><span class="label-text" data-i18n="sidebar.home">Inicio</span>
        </button>
        <button class="navitem" id="navFavorites" data-nav="favoritos" type="button" data-i18n-attr="title:sidebar.favorites" title="Favoritos">
          <svg class="icon"><use href="#i-star"/></svg><span class="label-text" data-i18n="sidebar.favorites">Favoritos</span><span class="nav-count" id="favCount"></span>
        </button>
        <button class="navitem" id="navMeetings" data-nav="calendario" type="button" data-i18n-attr="title:sidebar.calendar" title="Calendario">
          <svg class="icon"><use href="#i-calendar"/></svg><span class="label-text" data-i18n="sidebar.calendar">Calendario</span>
        </button>
        <button class="navitem" id="navDocs" data-nav="documentos" type="button" data-i18n-attr="title:sidebar.documents" title="Documentos">
          <svg class="icon"><use href="#i-doc"/></svg><span class="label-text" data-i18n="sidebar.documents">Documentos</span>
        </button>
      </nav>

      <!-- "Mis notas": tres objetivos con destinos distintos — el icono pliega
           la lista, el texto lleva a las reuniones de todos los proyectos y la
           flecha a la tabla de gestion. -->
      <div class="projlist" id="navInitiatives">
        <div class="projitem space-root">
          <button class="space-fold-btn" id="btnFoldProjects" type="button" aria-expanded="true" aria-label="Plegar o desplegar proyectos">
            <svg class="icon"><use href="#i-mynotes"/></svg>
          </button>
          <button class="space-toggle-btn" id="btnMyNotes" data-nav="misnotas" type="button" title="Ver las reuniones de todos los proyectos">
            <span class="label-text">Mis notas</span>
          </button>
          <button class="icon-btn space-add-btn" id="btnNewInitiative" type="button" data-i18n-attr="title:sidebar.newProjectTitle" title="Nuevo proyecto (Ctrl+N)" aria-label="Nuevo proyecto">
            <svg class="icon"><use href="#i-plus"/></svg>
          </button>
          <button class="icon-btn space-manage-btn" id="btnManageSpaces" data-nav="gestionar-espacios" type="button" title="Gestionar espacios" aria-label="Gestionar espacios">
            <svg class="icon icon-sm"><use href="#i-arrow-right"/></svg>
          </button>
        </div>
        <!-- El plegado va en .projlist-fold y el contenido en .projlist-nested:
             son dos elementos porque la animación usa grid-template-rows 0fr→1fr,
             que necesita un único hijo con overflow:hidden. app.js sigue
             inyectando las filas de proyecto en #sidebarTree. -->
        <div class="projlist-fold" id="sidebarFold">
          <div class="projlist-nested" id="sidebarTree"></div>
        </div>
      </div>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-footer">
        <!-- Archivados salio del pie para que el riel colapsado quede con dos
             iconos, como el mockup. No se pierde: la pantalla de Papelera lleva
             un conmutador Papelera/Archivados, asi que la vista sigue siendo
             alcanzable — que era el motivo por el que estaba aqui. -->
        <button class="navitem" id="btnTrash" type="button" title="Papelera">
          <svg class="icon"><use href="#i-trash"/></svg><span class="label-text">Papelera</span><span class="nav-count" id="trashCount"></span>
        </button>
        <button class="navitem" id="btnSettingsSide" type="button" data-i18n-attr="title:sidebar.settings" title="Configuracion">
          <svg class="icon"><use href="#i-settings"/></svg><span class="label-text" data-i18n="sidebar.settings">Configuracion</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-resize-handle" id="sidebarResizeHandle" title="Arrastrar para redimensionar"></div>

    <main class="main" id="main" tabindex="-1">
      <!-- inyectado por app.js -->
    </main>
  </div>

  <!-- ============ BARRA DE ACCIONES CONTEXTUAL ============ -->
  <footer class="actionbar" id="actionbar" aria-label="Acciones">
    <!-- inyectado por app.js según el estado global -->
  </footer>

  <!-- Handles de resize de ventana (frameless) -->
  <div class="wr wr-n"  data-dir="n"></div>
  <div class="wr wr-s"  data-dir="s"></div>
  <div class="wr wr-e"  data-dir="e"></div>
  <div class="wr wr-w"  data-dir="w"></div>
  <div class="wr wr-ne" data-dir="ne"></div>
  <div class="wr wr-nw" data-dir="nw"></div>
  <div class="wr wr-se" data-dir="se"></div>
  <div class="wr wr-sw" data-dir="sw"></div>

  <!-- ============ PANTALLA DE LICENCIA ============ -->
  <div class="license-gate" id="licenseGate" hidden>
    <div class="license-card">
      <div class="license-brand">
        <img src="assets/helpmeet-symbol.svg?v=20260802v2" alt="" class="license-symbol">
        <span class="license-brand-name">Helpmeet</span>
      </div>
      <h2 class="license-title">Activa tu licencia</h2>
      <p class="license-subtitle">Introduce la product key que recibiste al comprar Helpmeet.</p>
      <label for="licenseKeyInput" class="visually-hidden">Product key</label>
      <input id="licenseKeyInput" class="license-input" type="text"
             placeholder="HM-XXXX-XXXX-XXXX-XXXX"
             autocomplete="off" spellcheck="false" maxlength="22"
             onkeydown="if(event.key==='Enter') window.doLicenseActivate()">
      <button class="license-btn" onclick="window.doLicenseActivate()">Activar</button>
      <p class="license-error" id="licenseError" hidden></p>
    </div>
  </div>

  <!-- ============ OVERLAYS ============ -->
  <div class="overlay" id="overlayRoot" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <!-- Buscador global (Ctrl+K). <dialog> nativo: el navegador aporta gratis el
       cierre con Esc, el foco atrapado y el ::backdrop. Filtra proyectos y
       reuniones al instante en local; Enter lanza la búsqueda dentro de las
       transcripciones (api.search), que es lo que el mockup no podía hacer. -->
  <dialog class="search-overlay" id="searchOverlay" aria-label="Buscar">
    <div class="search-overlay-panel">
      <div class="search-overlay-input-row">
        <span class="so-ico" id="soIcon" aria-hidden="true"></span>
        <input type="text" id="searchInput" autocomplete="off" spellcheck="false"
               placeholder="Buscar proyectos, reuniones o texto transcrito"
               aria-label="Buscar proyectos, reuniones o texto transcrito">
        <span class="kbd">ESC</span>
      </div>
      <div class="search-overlay-results" id="searchOverlayResults"></div>
    </div>
  </dialog>

  <!-- Plantillas SVG de iconos. Inyectadas por app.js -->
  <script src="app.js?v=20260802tokens"></script>
</body>
</html>
