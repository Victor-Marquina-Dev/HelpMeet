<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helpmeet Admin</title>
<link rel="icon" type="image/svg+xml" href="assets/helpmeet-app-icon.svg">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0b0d0c; --card: #141615; --card2: #1a1c1b;
  --border: #252726; --border2: #2e3130;
  --green: #4ade80; --green-dim: rgba(74,222,128,.12);
  --red: #f87171; --red-dim: rgba(248,113,113,.1);
  --yellow: #fbbf24; --yellow-dim: rgba(251,191,36,.1);
  --accent: #aacfbf; --accent-dim: rgba(170,207,191,.1);
  --text: #e2e8e4; --muted: #9ca89f; --faint: #5c6660;
  --on-accent: #0a1a12;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* ─── LOGIN ─── */
#login { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.lcard { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 44px; width: 360px; text-align: center; }
.lcard .logo { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: -.5px; margin-bottom: 6px; }
.brand-logo { width: 34px; height: 34px; display: block; }
.lcard p { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
.inp { width: 100%; padding: 11px 14px; background: #0d0f0e; border: 1px solid var(--border2); border-radius: 10px; color: var(--text); font-size: 13px; font-family: monospace; outline: none; margin-bottom: 12px; }
.inp:focus { border-color: var(--accent); }
.btn-primary { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 10px; color: var(--on-accent); font-weight: 700; font-size: 14px; cursor: pointer; transition: .15s; }
.btn-primary:hover { background: #c5ebda; }
.err { color: var(--red); font-size: 12px; margin-top: 8px; display: none; }

/* ─── APP ─── */
#app { display: none; }
.topbar { height: 58px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; position: sticky; top: 0; z-index: 50; }
.topbar .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 800; font-size: 16px; color: var(--accent); letter-spacing: -.3px; }
.topbar .brand-logo { width: 25px; height: 25px; }
.topbar .right { display: flex; align-items: center; gap: 14px; }
.topbar .ts { font-size: 11px; color: var(--faint); }
.btn-sm { padding: 7px 14px; font-size: 12px; font-weight: 600; border: 1px solid var(--border2); background: var(--card2); color: var(--muted); border-radius: 8px; cursor: pointer; transition: .15s; }
.btn-sm:hover { color: var(--text); border-color: var(--accent); }

.main { max-width: 1160px; margin: 0 auto; padding: 28px 20px; }

/* ─── STATS ─── */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 20px; }
.stat .n { font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1; }
.stat .n--green { color: var(--green); }
.stat .n--red { color: var(--red); }
.stat .l { font-size: 12px; color: var(--muted); margin-top: 6px; }

/* ─── LOG ─── */
.section-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.log-box { background: #080a09; border: 1px solid var(--border); border-radius: 12px; padding: 16px; font-family: monospace; font-size: 12px; max-height: 140px; overflow-y: auto; line-height: 2; }
.log-ok  { color: var(--green); }
.log-err { color: var(--red); }
.log-ts  { color: var(--faint); margin-right: 8px; }
#logSection { display: none; margin-bottom: 24px; }

/* ─── TABLE ─── */
.tbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.table-loading { padding: 40px; text-align: center; color: var(--muted); }
table { width: 100%; border-collapse: collapse; }
th { background: var(--card2); padding: 11px 16px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); border-bottom: 1px solid var(--border); }
td { padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,.018); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge-active   { background: var(--green-dim); color: var(--green); }
.badge-revoked  { background: var(--red-dim); color: var(--red); }
.badge-refunded { background: var(--yellow-dim); color: var(--yellow); }
.badge-new { background: var(--accent-dim); color: var(--accent); margin-left: 5px; font-size: 10px; }

.td-id    { color: var(--faint); }
.td-plan  { text-transform: capitalize; color: var(--muted); }
.td-date  { color: var(--faint); font-size: 12px; }
.td-inactive { color: var(--faint); font-size: 11px; }

.mono { font-family: monospace; font-size: 12px; letter-spacing: .05em; color: var(--accent); }
.email-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* email status */
.mail-ok      { display: inline-flex; align-items: center; gap: 4px; color: var(--green); font-size: 11px; font-weight: 600; }
.mail-no      { color: var(--faint); font-size: 11px; }
.mail-pending { color: var(--yellow); font-size: 11px; }

/* action buttons */
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.abtn { padding: 6px 11px; font-size: 11px; font-weight: 600; border: none; border-radius: 7px; cursor: pointer; transition: .12s; white-space: nowrap; }
.abtn:disabled { opacity: .45; cursor: default; }
.abtn-send  { background: rgba(74,222,128,.12); color: var(--green); }
.abtn-send:hover:not(:disabled) { background: rgba(74,222,128,.2); }
.abtn-reset { background: rgba(170,207,191,.1); color: var(--accent); }
.abtn-reset:hover { background: rgba(170,207,191,.18); }
.abtn-rev   { background: var(--red-dim); color: var(--red); }
.abtn-rev:hover { background: rgba(248,113,113,.18); }

.btn-green { padding: 9px 18px; background: var(--accent); border: none; border-radius: 10px; color: var(--on-accent); font-weight: 700; font-size: 13px; cursor: pointer; }
.btn-green:hover { background: #c5ebda; }

/* ─── MODAL ─── */
dialog { background: var(--card); border: 1px solid var(--border2); border-radius: 18px; padding: 32px; width: 460px; max-width: 95vw; color: var(--text); position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0; }
dialog::backdrop { background: rgba(0,0,0,.7); backdrop-filter: blur(2px); }
dialog h3 { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
dialog.modal--sm { width: 400px; }
.check-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--muted); }
.modal-field { margin-bottom: 14px; }
.modal-field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.modal-field input,
.modal-field select { width: 100%; padding: 10px 14px; background: #0d0f0e; border: 1px solid var(--border2); border-radius: 9px; color: var(--text); font-size: 13px; outline: none; }
.modal-field input:focus,
.modal-field select:focus { border-color: var(--accent); }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
.btn-cancel { padding: 9px 18px; background: var(--card2); border: none; border-radius: 9px; color: var(--muted); cursor: pointer; font-size: 13px; }
.btn-cancel:hover { color: var(--text); }
.key-result { display: none; margin-top: 18px; background: #080a09; border: 1px solid rgba(74,222,128,.2); border-radius: 12px; padding: 20px; text-align: center; }
.key-result .lbl { font-size: 11px; color: var(--muted); margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.key-result code { font-size: 20px; letter-spacing: 3px; color: var(--green); font-weight: 700; font-family: monospace; }
.key-result .copy-btn { margin-top: 12px; background: var(--card2); border: none; border-radius: 7px; padding: 6px 14px; color: var(--muted); cursor: pointer; font-size: 12px; }

/* confirm modal */
.confirm-desc { color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 4px; }
.btn-danger { padding: 9px 18px; background: var(--red); border: none; border-radius: 9px; color: #fff; font-weight: 700; cursor: pointer; font-size: 13px; }

/* devices badge */
.dev-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; }
.dev-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.dev-dot--on { background: var(--green); }
.dev-count { color: var(--muted); }
.dev-expand { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 11px; margin-left: 4px; padding: 2px 5px; border-radius: 4px; transition: .12s; }
.dev-expand:hover { background: var(--card2); color: var(--accent); }

/* activation detail row */
.detail-row td { padding: 0; border-bottom: 1px solid var(--border); }
.detail-inner { padding: 10px 18px 14px 36px; }
.act-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.act-table th { background: none; padding: 5px 10px; text-align: left; font-size: 10px; color: var(--faint); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .06em; }
.act-table td { padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.04); color: var(--muted); }
.act-table tr:last-child td { border-bottom: none; }
.act-status-on  { color: var(--green); font-weight: 600; }
.act-status-off { color: var(--faint); }
.act-ver  { font-family: monospace; color: var(--accent); }
.no-acts  { color: var(--faint); font-size: 12px; padding: 8px 0; }

/* toast */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--card2); border: 1px solid var(--border2); border-radius: 12px; padding: 13px 20px; font-size: 13px; display: none; z-index: 999; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
.toast.show { display: block; }
</style>
</head>
<body>

<div id="login">
  <div class="lcard">
    <div class="logo"><img class="brand-logo" src="assets/helpmeet-symbol.svg" alt="">Helpmeet</div>
    <p>Panel de administración</p>
    <input class="inp" type="password" id="keyInput" placeholder="Admin Key" autocomplete="off" aria-label="Admin Key">
    <button class="btn-primary" id="loginBtn">Entrar</button>
    <div class="err" id="loginErr">Clave incorrecta</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <span class="brand"><img class="brand-logo" src="assets/helpmeet-symbol.svg" alt="">Helpmeet Admin</span>
    <div class="right">
      <span class="ts" id="lastUpdated"></span>
      <button class="btn-sm" id="refreshBtn">↻ Actualizar</button>
      <button class="btn-sm" id="logoutBtn">Salir</button>
    </div>
  </div>

  <div class="main">
    <!-- STATS -->
    <div class="stats">
      <div class="stat"><div class="n" id="sTotal">—</div><div class="l">Licencias totales</div></div>
      <div class="stat"><div class="n n--green" id="sActive">—</div><div class="l">Activas</div></div>
      <div class="stat"><div class="n n--red" id="sRevoked">—</div><div class="l">Revocadas</div></div>
      <div class="stat"><div class="n" id="sCustomers">—</div><div class="l">Clientes</div></div>
    </div>

    <!-- LOG -->
    <div id="logSection">
      <div class="section-hd">
        <div class="section-title">Actividad reciente</div>
        <button class="btn-sm" id="clearLogBtn">Limpiar</button>
      </div>
      <div class="log-box" id="logBox"></div>
    </div>

    <!-- TABLE -->
    <div class="tbar">
      <div class="section-title">Licencias</div>
      <button class="btn-green" id="newLicBtn">+ Nueva licencia</button>
    </div>
    <div class="table-wrap">
      <div class="table-loading" id="tableLoading">Cargando…</div>
      <table id="licTable" hidden>
        <thead>
          <tr>
            <th>#</th><th>Cliente</th><th>Key</th><th>Plan</th>
            <th>Estado</th><th>Dispositivos</th><th>Email</th><th>Creada</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="licBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL CREAR -->
<dialog id="createDialog" aria-labelledby="createModalTitle">
  <h3 id="createModalTitle">Nueva licencia</h3>
  <div class="modal-field">
    <label for="createEmail">Email del cliente *</label>
    <input id="createEmail" type="email" placeholder="cliente@email.com">
  </div>
  <div class="modal-field">
    <label for="createName">Nombre (opcional)</label>
    <input id="createName" type="text" placeholder="Nombre">
  </div>
  <div class="modal-field">
    <label for="createPlan">Plan</label>
    <select id="createPlan">
      <option value="personal">Personal</option>
      <option value="pro">Pro</option>
      <option value="team">Team</option>
    </select>
  </div>
  <label class="check-label" for="createSendEmail">
    <input type="checkbox" id="createSendEmail" checked> Notificarme por email al crear
  </label>
  <div class="key-result" id="keyResult">
    <div class="lbl">Key generada — cópiala ahora</div>
    <code id="keyValue"></code>
    <button class="copy-btn" id="copyKeyBtn">Copiar</button>
  </div>
  <div class="err" id="createErr"></div>
  <div class="modal-btns">
    <button class="btn-cancel" id="closeCreateBtn">Cerrar</button>
    <button class="btn-green" id="createBtn">Crear licencia</button>
  </div>
</dialog>

<!-- MODAL CONFIRMAR -->
<dialog id="confirmDialog" class="modal--sm" aria-labelledby="confirmTitle">
  <h3 id="confirmTitle">Confirmar acción</h3>
  <p class="confirm-desc" id="confirmDesc"></p>
  <div class="modal-btns">
    <button class="btn-cancel" id="cancelConfirmBtn">Cancelar</button>
    <button class="btn-danger" id="confirmBtn">Confirmar</button>
  </div>
</dialog>

<output class="toast" id="toast"></output>

<script type="module">
'use strict';

const API = 'https://web-production-93435.up.railway.app';

// ─── STATE ───
let adminKey = '';
let confirmCallback = null;
const emailStatus = JSON.parse(localStorage.getItem('hm_email_status') || '{}');

// ─── UTILS ───
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function el(id) { return document.getElementById(id); }

function saveEmailStatus() { localStorage.setItem('hm_email_status', JSON.stringify(emailStatus)); }

function headers(extra = {}) {
  return { 'X-Admin-Key': adminKey, ...extra };
}

async function apiFetch(path, options = {}) {
  return fetch(`${API}${path}`, { ...options, headers: { ...headers(), ...options.headers } });
}

// ─── TOAST ───
let toastTimer;
function showToast(msg) {
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── LOG ───
function addLog(type, msg) {
  const box = el('logBox');
  el('logSection').style.display = 'block';
  const t = new Date().toLocaleTimeString('es');
  const cls = type === 'ok' ? 'log-ok' : 'log-err';
  const icon = type === 'ok' ? '✓' : '✗';
  const entry = document.createElement('div');
  entry.innerHTML = `<span class="log-ts">[${esc(t)}]</span><span class="${cls}">${icon} ${esc(msg)}</span>`;
  box.prepend(entry);
}

function clearLogs() {
  el('logBox').innerHTML = '';
  el('logSection').style.display = 'none';
}

// ─── LOGIN ───
async function doLogin() {
  const k = el('keyInput').value.trim();
  if (!k) return;
  try {
    const r = await fetch(`${API}/api/admin/licenses`, { headers: { 'X-Admin-Key': k } });
    if (r.ok) {
      adminKey = k;
      localStorage.setItem('hm_admin_key', k);
      el('login').style.display = 'none';
      el('app').style.display = 'block';
      loadData();
    } else {
      el('loginErr').style.display = 'block';
    }
  } catch {
    el('loginErr').style.display = 'block';
  }
}

function doLogout() {
  localStorage.removeItem('hm_admin_key');
  location.reload();
}

// ─── DATA ───
async function loadData() {
  try {
    const [lics, custs] = await Promise.all([
      apiFetch('/api/admin/licenses').then(r => r.json()),
      apiFetch('/api/admin/customers').then(r => r.json()),
    ]);

    el('sTotal').textContent = lics.length;
    el('sActive').textContent = lics.filter(l => l.status === 'active').length;
    el('sRevoked').textContent = lics.filter(l => ['revoked', 'refunded'].includes(l.status)).length;
    el('sCustomers').textContent = custs.length;
    el('lastUpdated').textContent = new Date().toLocaleTimeString('es');

    renderTable(lics);
  } catch {
    el('tableLoading').textContent = 'Error al cargar datos.';
  }
}

function fmtDate(dt) {
  if (!dt) return '—';
  return new Date(dt).toLocaleDateString('es', { day: '2-digit', month: 'short', year: '2-digit' });
}
function fmtDatetime(dt) {
  if (!dt) return '—';
  const d = new Date(dt);
  return d.toLocaleDateString('es', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
}

function renderActivationDetail(acts, colspan) {
  const tr = document.createElement('tr');
  tr.className = 'detail-row';
  const td = document.createElement('td');
  td.colSpan = colspan;
  if (!acts || acts.length === 0) {
    td.innerHTML = `<div class="detail-inner"><span class="no-acts">Sin dispositivos activados aún.</span></div>`;
  } else {
    const rows = acts.map(a => `
      <tr>
        <td>${esc(a.device_name || '—')}</td>
        <td>${esc(a.os || '—')}</td>
        <td><span class="act-ver">${esc(a.app_version || '—')}</span></td>
        <td class="${a.status === 'active' ? 'act-status-on' : 'act-status-off'}">${a.status === 'active' ? '● Activo' : '○ Inactivo'}</td>
        <td class="td-date">${fmtDatetime(a.first_activated_at)}</td>
        <td class="td-date">${fmtDatetime(a.last_seen_at)}</td>
      </tr>`).join('');
    td.innerHTML = `<div class="detail-inner">
      <table class="act-table">
        <thead><tr><th>Dispositivo</th><th>OS</th><th>Versión app</th><th>Estado</th><th>Primera activación</th><th>Última validación</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }
  tr.appendChild(td);
  return tr;
}

function renderTable(lics) {
  const body = el('licBody');
  body.innerHTML = '';

  lics.slice().reverse().forEach(lic => {
    const isNew = (Date.now() - new Date(lic.created_at).getTime()) < 86400000;
    const date = fmtDate(lic.created_at);
    const email = lic.customer?.email || '—';
    const newTag = isNew ? `<span class="badge badge-new">NUEVO</span>` : '';

    const badge = {
      active:   `<span class="badge badge-active">● Activa</span>`,
      refunded: `<span class="badge badge-refunded">↩ Reembolsada</span>`,
    }[lic.status] ?? `<span class="badge badge-revoked">✕ Revocada</span>`;

    const es = emailStatus[lic.id];
    const emailCol = {
      ok:      `<span class="mail-ok">✓ Enviado</span>`,
      fail:    `<span class="mail-no">✗ Error</span>`,
      pending: `<span class="mail-pending">⟳ Enviando</span>`,
    }[es] ?? `<span class="mail-no">— Sin enviar</span>`;

    const acts = lic.activations || [];
    const activeCount = acts.filter(a => a.status === 'active').length;
    const devDot = activeCount > 0
      ? `<span class="dev-dot dev-dot--on"></span>`
      : `<span class="dev-dot"></span>`;
    const devCol = `<div class="dev-badge">${devDot}<span class="dev-count">${activeCount}/${lic.max_devices}</span>
      <button class="dev-expand" data-action="toggle" data-id="${lic.id}" title="Ver historial de dispositivos">▾ ${acts.length}</button></div>`;

    const actions = lic.status === 'active'
      ? `<div class="actions">
          <button class="abtn abtn-send"  data-action="send"  data-id="${lic.id}" data-email="${esc(email)}">✉ Enviar key</button>
          <button class="abtn abtn-reset" data-action="reset" data-id="${lic.id}">↺ Reset PC</button>
          <button class="abtn abtn-rev"   data-action="revoke" data-id="${lic.id}">✕ Revocar</button>
         </div>`
      : `<span class="td-inactive">${esc(lic.status)}</span>`;

    const tr = document.createElement('tr');
    tr.id = `row-${lic.id}`;
    tr.dataset.acts = JSON.stringify(acts);
    tr.innerHTML = `
      <td class="td-id">#${lic.id}</td>
      <td class="email-cell">${esc(email)}${newTag}</td>
      <td><span class="mono">...${esc(lic.key_last4)}</span></td>
      <td class="td-plan">${esc(lic.plan)}</td>
      <td>${badge}</td>
      <td>${devCol}</td>
      <td id="email-status-${lic.id}">${emailCol}</td>
      <td class="td-date">${esc(date)}</td>
      <td>${actions}</td>`;
    body.appendChild(tr);
  });

  el('tableLoading').style.display = 'none';
  el('licTable').hidden = false;
}

// ─── ACTIONS (event delegation on tbody) ───
el('licBody').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { action, id, email } = btn.dataset;
  if (action === 'send')   sendKey(Number(id), email, btn);
  if (action === 'reset')  confirmAction('reset', Number(id));
  if (action === 'revoke') confirmAction('revoke', Number(id));
  if (action === 'toggle') {
    const mainRow = document.getElementById(`row-${id}`);
    const existing = document.getElementById(`detail-${id}`);
    if (existing) {
      existing.remove();
      btn.textContent = `▾ ${JSON.parse(mainRow.dataset.acts).length}`;
    } else {
      const acts = JSON.parse(mainRow.dataset.acts);
      const detailRow = renderActivationDetail(acts, 9);
      detailRow.id = `detail-${id}`;
      mainRow.after(detailRow);
      btn.textContent = `▴ ${acts.length}`;
    }
  }
});

async function sendKey(id, email, btn) {
  btn.disabled = true;
  btn.textContent = '⟳ Enviando...';
  emailStatus[id] = 'pending';
  setEmailStatus(id, '<span class="mail-pending">⟳ Enviando</span>');

  try {
    const r = await apiFetch(`/api/admin/licenses/${id}/generate-key`, { method: 'POST' });
    const data = await r.json();
    if (data.ok) {
      emailStatus[id] = data.email_sent ? 'ok' : 'fail';
      saveEmailStatus();
      setEmailStatus(id, data.email_sent
        ? `<span class="mail-ok">✓ Enviado</span>`
        : `<span class="mail-no">✗ Sin email</span>`);
      addLog(data.email_sent ? 'ok' : 'err',
        data.email_sent ? `${email} | Email enviado · Key: ...${data.key.slice(-4)}` : `${email} | Key generada (sin email): ${data.key}`);
      showToast(data.email_sent ? 'Email enviado a tu Gmail' : 'Key generada — revisa el log');
    } else {
      emailStatus[id] = 'fail'; saveEmailStatus();
      setEmailStatus(id, `<span class="mail-no">✗ Error</span>`);
      addLog('err', `Error: ${data.error || 'desconocido'}`);
    }
  } catch {
    emailStatus[id] = 'fail'; saveEmailStatus();
    setEmailStatus(id, `<span class="mail-no">✗ Error</span>`);
    addLog('err', 'Error de conexión');
  }
  btn.disabled = false;
  btn.textContent = '✉ Enviar key';
}

function setEmailStatus(id, html) {
  const cell = el(`email-status-${id}`);
  if (cell) cell.innerHTML = html;
}

// ─── CONFIRM MODAL ───
const CONFIRM_COPY = {
  revoke: { title: 'Revocar licencia',      desc: id => `Licencia #${id} quedará revocada y el usuario no podrá usarla.` },
  reset:  { title: 'Resetear dispositivos', desc: id => `Se desactivarán todos los dispositivos de la licencia #${id}. El cliente podrá activar en un PC nuevo.` },
};

function confirmAction(type, id) {
  const copy = CONFIRM_COPY[type];
  el('confirmTitle').textContent = copy.title;
  el('confirmDesc').textContent  = copy.desc(id);
  confirmCallback = type === 'revoke' ? () => revokeLicense(id) : () => resetDevices(id);
  el('confirmDialog').showModal();
}

function closeConfirm() { el('confirmDialog').close(); }

async function revokeLicense(id) {
  const r = await apiFetch(`/api/admin/licenses/${id}/revoke`, { method: 'POST' });
  if ((await r.json()).ok) { addLog('ok', `Licencia #${id} revocada`); showToast('Licencia revocada'); loadData(); }
}

async function resetDevices(id) {
  const r = await apiFetch(`/api/admin/licenses/${id}/reset-devices`, { method: 'POST' });
  if ((await r.json()).ok) { addLog('ok', `Dispositivos de #${id} reseteados`); showToast('Dispositivos reseteados'); loadData(); }
}

// ─── CREAR LICENCIA ───
let createdKey = '';

function openCreateModal() {
  el('createDialog').showModal();
  el('keyResult').style.display = 'none';
  el('createErr').style.display = 'none';
  el('createBtn').style.display = '';
  el('createEmail').value = '';
  el('createName').value = '';
  setTimeout(() => el('createEmail').focus(), 100);
}

function closeCreateModal() {
  el('createDialog').close();
  loadData();
}

async function createLicense() {
  const email = el('createEmail').value.trim();
  const name  = el('createName').value.trim();
  const plan  = el('createPlan').value;
  const send  = el('createSendEmail').checked;
  const errEl = el('createErr');
  const btn   = el('createBtn');

  if (!email) { errEl.textContent = 'El email es obligatorio'; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Creando...';

  try {
    // Buscar cliente existente primero para evitar IntegrityError en servidor
    let customerId;
    const allCustomers = await apiFetch('/api/admin/customers').then(r => r.json());
    const existing = allCustomers.find(c => c.email.toLowerCase() === email.toLowerCase());

    if (existing) {
      customerId = existing.id;
    } else {
      const rc = await apiFetch('/api/admin/customers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, name: name || null }),
      });
      if (!rc.ok) {
        errEl.textContent = 'Error creando cliente';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Crear licencia';
        return;
      }
      customerId = (await rc.json()).id;
    }

    if (!customerId) {
      errEl.textContent = 'Error creando cliente';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Crear licencia';
      return;
    }

    const rl = await apiFetch('/api/admin/licenses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customer_id: customerId, plan }),
    });
    const lic = await rl.json();
    createdKey = lic.license_key;
    el('keyValue').textContent = createdKey;
    el('keyResult').style.display = 'block';
    btn.style.display = 'none';
    addLog('ok', `Licencia #${lic.id} creada para ${email}`);

    if (send) {
      await apiFetch(`/api/admin/licenses/${lic.id}/generate-key`, { method: 'POST' });
      emailStatus[lic.id] = 'ok';
      saveEmailStatus();
      addLog('ok', 'Notificación enviada a tu Gmail');
      showToast('Licencia creada y email enviado');
    } else {
      showToast('Licencia creada');
    }
  } catch {
    errEl.textContent = 'Error de conexión';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Crear licencia';
  }
}

function copyKey() {
  navigator.clipboard.writeText(createdKey);
  showToast('Key copiada');
}

// ─── EVENT LISTENERS ───
el('loginBtn').addEventListener('click', doLogin);
el('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
el('logoutBtn').addEventListener('click', doLogout);
el('refreshBtn').addEventListener('click', loadData);
el('clearLogBtn').addEventListener('click', clearLogs);
el('newLicBtn').addEventListener('click', openCreateModal);
el('closeCreateBtn').addEventListener('click', closeCreateModal);
el('createBtn').addEventListener('click', createLicense);
el('copyKeyBtn').addEventListener('click', copyKey);
el('cancelConfirmBtn').addEventListener('click', closeConfirm);
el('confirmBtn').addEventListener('click', () => { closeConfirm(); confirmCallback?.(); });

// ─── BOOT ───
const savedKey = localStorage.getItem('hm_admin_key');
if (savedKey) { el('keyInput').value = savedKey; await doLogin(); }
setInterval(() => { if (adminKey) loadData(); }, 60000);
</script>
